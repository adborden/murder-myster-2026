gardener:
  name: The Gardener
  motive: |
    Mr Blackwood had promised to invest funds in the gardener’s new
    plant nursery. When Mr Blackwood pulled out of the deal, the
    gardener was left with tremendous debt. The land was settled, the
    construction had started, and the plants and seeds were already
    arranged. With Blackwood out of the way, could the contract be
    forged and the gardener’s dream be realized?

chauffeur:
  name: The Chauffeur
  motive: |
    The chauffeur was recently blackmailed by environmental protesters who want to
    stop Mr Blackwood’s project in the Amazon which would be devastating to the
    rainforest and the local communities. They’ve offered the chauffeur enough
    money to “take care” of Mr Blackwood. It’s enough that he would never have to
    work again. Would he really go through with it?

maid:
  name: The Maid
  motive: |
    The maid had a son who disappeared five years ago. Mr Blackwood was the last
    person who saw him alive and was initially the person of interest in the
    investigation, which was closed and shelved as a cold case. It wouldn't have
    been the first time that Mr Blackwood has bribed his way out of justice. The
    maid has gotten close to Mr Blackwood through a fake name. Was this killing her
    revenge?
