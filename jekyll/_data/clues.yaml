- time: 4:00 p.m.
  clue: |
    The gardener is tending the garden, picking lavender for Mr Blackwood tea.
    The chauffeur is wandering the garden and leans down to sniff a purple
    flower. The gardener says to him, “Careful! That's belladonna. We have
    plenty of poisonous plants in the garden.”

- time: 7:30 p.m.
  clue: |
    The gardener drops off the fresh lavender for Blackwood’s tea in the
    kitchen. The maid will come by later to make the tea and bring it to Mr
    Blackwood’s room. As he’s leaving, he notices the chauffeur looking for a
    snack.

- time: 8:00 p.m.
  clue: |
    The maid brings the tea to Mr Blackwood. As she walks past the chauffeur's
    room, she notices muddy footprints on the carpet. It's not unusual for the
    gardener to track mud in from the garden.
