---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: murder-mystery-2026
  labels:
    app: murder-mystery-2026
spec:
  replicas: 2
  selector:
    matchLabels:
      app: murder-mystery-2026
  template:
    metadata:
      labels:
        app: murder-mystery-2026
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: web
          image: ghcr.io/adborden/murder-mystery-2026:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
